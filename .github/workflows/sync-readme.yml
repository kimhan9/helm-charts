name: Sync README to GitHub Pages

on:
  push:
    branches:
      - 'main'
    paths:
      - 'README.md'

jobs:
  sync:
    permissions:
      contents: write # Required for git push

    runs-on: ubuntu-latest
    steps:
      # 1. Checkout main branch using the latest v4 action
      - name: Checkout main branch
        uses: actions/checkout@v4
        
      # 2. Save the README file safely outside the workspace
      - name: Copy README to temp directory
        run: cp -f README.md ${{ runner.temp }}/README.md

      # 3. Checkout gh-pages branch cleanly
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # 4. Apply changes, check for diffs, and safely push
      - name: Commit and Push README
        run: |
          cp -f ${{ runner.temp }}/README.md .
          
          # Modern GitHub Actions Bot configuration
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
          # Safely check for changes to prevent empty commit crashes
          if git diff --quiet README.md; then
            echo "No changes detected in README.md. Skipping sync."
          else
            git add README.md
            git commit --signoff -m "docs: sync README from main [skip ci]"
            git push origin gh-pages
          fi