replicaCount: 2

image:
  repository: megaxcn/predixy
  tag: "20240424"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 7617
  targetPort: 7617
  annotations: {}
  # For internal NLB, change type to LoadBalancer and uncomment annotations below:
  # type: LoadBalancer
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: external
  #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
  #   service.beta.kubernetes.io/aws-load-balancer-scheme: internal

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}  
tolerations: []
affinity: {}

topologySpreadConstraints: []

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: false
  ingressFrom: []
  # Example:
  # ingressFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: app

predixy:
  name: Predixy
  bind: "0.0.0.0:7617"
  workerThreads: 1
  clientTimeout: 300
  logSamples:
    verb: 0
    debug: 0
    info: 10000
    notice: 1
    warn: 1
    error: 1

  # Optional client password for applications connecting to Predixy.
  # When enabled, clients must AUTH with this password before using the proxy.
  clientAuth:
    enabled: false
    password: ""
    mode: admin

  cluster:
    # Backend Redis Cluster password. Leave empty if Redis has no password.
    password: ""
    masterReadPriority: 60
    staticSlaveReadPriority: 50
    dynamicSlaveReadPriority: 50
    refreshInterval: 1
    serverTimeout: 1
    serverFailureLimit: 10
    serverRetryTimeout: 1
    keepAlive: 120

    # Seed nodes for Redis Cluster discovery.
    # Use Kubernetes service DNS if Predixy runs inside EKS.
    servers:
      - redis-cluster-0.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-1.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-2.redis-cluster-headless.redis.svc.cluster.local:6379

# Replace the generated predixy.conf completely when needed.
customConfig: ""
