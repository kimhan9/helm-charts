# Default values for predixy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: megaxcn/predixy
  tag: "20240424"
  pullPolicy: IfNotPresent
  
# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

predixy:
  name: Predixy
  bind: "0.0.0.0:7617"
  workerThreads: 1
  clientTimeout: 300
  logSamples:
    verb: 0
    debug: 0
    info: 10000
    notice: 1
    warn: 1
    error: 1

  # Optional client password for applications connecting to Predixy.
  # When enabled, clients must AUTH with this password before using the proxy.
  clientAuth:
    enabled: false
    password: ""
    mode: admin

  cluster:
    # Backend Redis Cluster password. Leave empty if Redis has no password.
    password: ""
    masterReadPriority: 60
    staticSlaveReadPriority: 50
    dynamicSlaveReadPriority: 50
    refreshInterval: 1
    serverTimeout: 1
    serverFailureLimit: 10
    serverRetryTimeout: 1
    keepAlive: 120

    # Seed nodes for Redis Cluster discovery.
    # Use Kubernetes service DNS if Predixy runs inside EKS.
    servers:
      - redis-cluster-0.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-1.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-2.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-3.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-4.redis-cluster-headless.redis.svc.cluster.local:6379
      - redis-cluster-5.redis-cluster-headless.redis.svc.cluster.local:6379

service:
  type: ClusterIP
  port: 7617

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- Expose the service via Gateway API TCPRoute (L4/TCP, e.g. Redis protocol).
# Requires the tcproutes.gateway.networking.k8s.io CRD (Gateway API experimental channel).
tcpRoute:
  # TCPRoute enabled.
  enabled: false
  # TCPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: tcp
    # namespace: default
  # Backend references. Empty name defaults to the chart's own service.
  backendRefs:
  - name: ""
    port: 7617
    # weight: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

pdb:
  enabled: true
  minAvailable: 1

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Replace the generated predixy.conf completely when needed.
customConfig: ""
