apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "predixy.fullname" . }}-test-connection"
  labels:
    {{- include "predixy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: nc
      image: busybox
      command: ['nc']
      args: ['-z', '-w', '5', '{{ include "predixy.fullname" . }}', '{{ .Values.service.port }}']
  restartPolicy: Never
